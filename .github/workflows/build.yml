name: 编译未签名 IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 项目
        run: xcodegen generate

      - name: 缓存 Swift Package 依赖
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}

      - name: 缓存构建产物
        uses: actions/cache@v4
        with:
          path: build/Build
          key: build-${{ runner.os }}-${{ hashFiles('Sources/**/*.swift', 'project.yml') }}
          restore-keys: |
            build-${{ runner.os }}-

      - name: 解析 Swift 包依赖
        run: xcodebuild -project 局域传.xcodeproj -scheme 局域传 -destination 'generic/platform=iOS' -resolvePackageDependencies

      - name: 编译 App (强制关闭签名)
        run: |
          xcodebuild -project 局域传.xcodeproj \
                     -scheme 局域传 \
                     -configuration Release \
                     -derivedDataPath build \
                     -destination 'generic/platform=iOS' \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES \
                     DEVELOPMENT_TEAM="" \
                     PROVISIONING_PROFILE_SPECIFIER=""

      - name: 打包为未签名的 IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/局域传.app"
          if [ -z "$APP_PATH" ]; then
            echo "::error::未找到 .app 文件，编译失败！"
            exit 1
          fi
          echo "找到 App: $APP_PATH"
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -r 局域传.ipa Payload/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 局域传-未签名包
          path: 局域传.ipa
