name: 编译未签名 IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      # ---------- 1. 缓存 XcodeGen 二进制（跳过 brew install） ----------
      - name: 缓存 XcodeGen
        id: cache-xcodegen
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/xcodegen
          key: xcodegen-2.43.2

      - name: 安装 XcodeGen
        if: steps.cache-xcodegen.outputs.cache-hit != 'true'
        run: |
          curl -L -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.43.2/xcodegen.zip
          unzip -o /tmp/xcodegen.zip -d /tmp/xcodegen
          sudo mv /tmp/xcodegen/bin/xcodegen /usr/local/bin/xcodegen
          sudo chmod +x /usr/local/bin/xcodegen
          xcodegen --version

      - name: 生成 Xcode 项目
        run: xcodegen generate

      # ---------- 2. 缓存 Swift Package 依赖 ----------
      - name: 缓存 SPM 依赖
        uses: actions/cache@v4
        with:
          path: |
            build/SourcePackages
            build/ModuleCache.noindex
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml', 'Package.resolved') }}

      # ---------- 3. 缓存 DerivedData（可选，进一步提速） ----------
      - name: 缓存构建产物
        uses: actions/cache@v4
        with:
          path: build/Build
          key: deriveddata-${{ runner.os }}-${{ hashFiles('project.yml', 'Sources/**/*.swift') }}-${{ github.sha }}
          restore-keys: |
            deriveddata-${{ runner.os }}-${{ hashFiles('project.yml', 'Sources/**/*.swift') }}-

      # ---------- 4. 编译（合并 resolve + build，避免重复解析） ----------
      - name: 编译 App
        run: |
          xcodebuild -project 局域传.xcodeproj \
                     -scheme 局域传 \
                     -configuration Release \
                     -derivedDataPath build \
                     -destination 'generic/platform=iOS' \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES \
                     DEVELOPMENT_TEAM="" \
                     PROVISIONING_PROFILE_SPECIFIER=""

      # ---------- 5. 打包 IPA ----------
      - name: 打包为未签名的 IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/局域传.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::未找到 .app 文件，编译失败！"
            exit 1
          fi
          echo "找到 App: $APP_PATH"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -r 局域传.ipa Payload/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 局域传-未签名包
          path: 局域传.ipa
